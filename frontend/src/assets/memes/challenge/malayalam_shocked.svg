  <!-- Wide Shocked Eyes -->
  <circle cx="140" cy="150" r="28" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="140" cy="150" r="10" fill="#000000"/>
  <circle cx="260" cy="150" r="28" fill="#ffffff" stroke="#000000" stroke-width="4"/>
