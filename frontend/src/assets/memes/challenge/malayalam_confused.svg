<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#1e1b4b" rx="24"/>
  <circle cx="200" cy="190" r="140" fill="#fde047" stroke="#eab308" stroke-width="8"/>
  <!-- Confused Eyes -->
  <circle cx="150" cy="160" r="22" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="150" cy="160" r="8" fill="#000000"/>
  <circle cx="250" cy="160" r="15" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="250" cy="160" r="5" fill="#000000"/>
  <!-- Eyebrows -->
  <path d="M 120 130 Q 150 110 180 140" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 220 140 Q 250 145 270 120" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Confused Wavy Mouth -->
  <path d="M 140 240 Q 170 210 200 240 T 260 230" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Hand Scratching Head -->
  <path d="M 280 200 Q 320 120 260 90" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Malayalam Meme Label Badge -->
  <rect x="30" y="320" width="340" height="50" rx="12" fill="#4338ca"/>
  <text x="200" y="353" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">എന്തൊക്കെയാണോ എന്തോ! (SALIM KUMAR)</text>
</svg>
