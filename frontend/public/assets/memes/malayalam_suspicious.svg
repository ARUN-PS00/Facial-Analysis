<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#78350f" rx="24"/>
  <circle cx="200" cy="190" r="140" fill="#fde047" stroke="#eab308" stroke-width="8"/>
  <!-- Squinting Side-Eye Eyes -->
  <path d="M 120 160 Q 150 145 180 160" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="170" cy="158" r="6" fill="#000000"/>
  <path d="M 220 160 Q 250 145 280 160" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="270" cy="158" r="6" fill="#000000"/>
  <!-- Raised Brow Side -->
  <path d="M 115 130 Q 145 130 175 135" stroke="#000000" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 220 120 Q 250 100 280 125" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Smirk / Suspicious Mouth -->
  <path d="M 140 230 Q 190 250 250 215" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Malayalam Meme Label Badge -->
  <rect x="30" y="320" width="340" height="50" rx="12" fill="#92400e"/>
  <text x="200" y="353" font-family="sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">എന്തിനോ വേണ്ടി തിളയ്ക്കുന്ന സാമ്പാർ!</text>
</svg>
