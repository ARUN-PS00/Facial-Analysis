<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#1e1b4b" rx="24"/>
  <circle cx="200" cy="200" r="140" fill="#fde047" stroke="#eab308" stroke-width="8"/>
  <!-- Confused Eyes -->
  <circle cx="150" cy="170" r="22" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="150" cy="170" r="8" fill="#000000"/>
  <circle cx="250" cy="170" r="16" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="250" cy="170" r="5" fill="#000000"/>
  <!-- Asymmetric Brows -->
  <path d="M 120 140 Q 150 120 180 150" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 220 150 Q 250 155 270 130" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Wavy Confused Mouth -->
  <path d="M 140 250 Q 170 220 200 250 T 260 240" stroke="#000000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Hand Scratching Head -->
